[project]
name = "realapp-tools"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["fastapi>=0.162.4", "pydantic>=2.14.3", "uvicorn>=0.54.0"]

[dependency-groups]
dev = ["commitizen>=4.19.3", "pre-commit>=4.7.0", "ruff>=0.17.4"]

[tool.ruff]
line-length = 100
include = ["*.py"]
exclude = [
    ".venv",
    "__pycache__",
    ".ruff_cache",
    "build",
    "dist",
    ".git",
    ".github",
    ".vscode",
    "LICENSE",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "COM812",
    "T201",
    "W292",
    "ANN001",
    "ANN002",
    "ANN201",
    "ANN202",
    "ANN204",
    "ERA001",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# This suite uses unittest assertions.
"tests/test_card_upgrade.py" = ["PT009"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
